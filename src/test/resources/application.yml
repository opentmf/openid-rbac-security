    write:
      username: writer@pia-team.com
      password: writer

server:
  servlet:
    context-path: /opentmf/commons

opentmf:
  security:
    user-claim: sub
    authorities-claim: groups
    secure-endpoints:
      - method: POST
        path: /car
        roles:
          - write
      - method: GET
        path: /car/*
        roles:
          - read
          - write
      - method: PUT
        path: /car
        roles:
          - write
      - method: DELETE
        path: /car/*
        roles:
          - write

    allowed-endpoints:
      - method: GET
        path: /car

    whitelist:
      - /whitelist/**

    blacklist:
      - /blacklist/**
